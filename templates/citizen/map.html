{% extends "shell.html" %}
{% block title %}Nearby issues — CivicPulse{% endblock %}

{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Civic issues near you</h1>
    <p id="map-status">Loading issues...</p>
  </div>
  <a class="btn btn-signal" href="{{ url_for('citizen.report') }}">Report an issue</a>
</div>

{% include "_map_controls.html" %}
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  window.CP_MAP_CENTER = [15.8497, 74.4977];
  window.CP_ISSUE_URL = "{{ url_for('citizen.issue_details', issue_id=0) }}";
</script>
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
{% endblock %}
